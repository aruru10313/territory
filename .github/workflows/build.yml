name: Build Territory NeoForge 1.21.1

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Territory Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload Territory Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Territory-NeoForge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
